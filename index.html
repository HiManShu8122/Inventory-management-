<!DOCTYPE html>
<html lang="en" x-data="inventoryApp()" :lang="lang" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vyapar Stock & Reorder Manager</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        [x-cloak] {
            display: none !important;
        }
    </style>
</head>

<body class="bg-slate-50 text-slate-900 min-h-screen">

    <!-- App Wrapper -->
    <div class="max-w-4xl mx-auto p-4 sm:p-6 pb-24">

        <!-- Header -->
        <header
            class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8 bg-white p-5 rounded-2xl shadow-sm border border-slate-100">

            <div>
                <h1 class="text-2xl font-bold tracking-tight text-slate-800" x-text="t('appTitle')"></h1>
                <p class="text-sm text-slate-500 mt-0.5" x-text="t('appSubtitle')"></p>
            </div>

            <!-- Language Switcher -->
            <div class="flex items-center bg-slate-100 p-1 rounded-xl self-end sm:self-auto">

                <button @click="lang = 'en'"
                    :class="lang === 'en'
                        ? 'bg-white shadow-sm text-slate-900 font-medium'
                        : 'text-slate-500 hover:text-slate-800'"
                    class="px-3 py-1.5 text-xs rounded-lg transition-all">
                    English
                </button>

                <button @click="lang = 'hi'"
                    :class="lang === 'hi'
                        ? 'bg-white shadow-sm text-slate-900 font-medium'
                        : 'text-slate-500 hover:text-slate-800'"
                    class="px-3 py-1.5 text-xs rounded-lg transition-all">
                    हिंदी
                </button>

            </div>
        </header>


        <!-- Stats Overview -->
        <div class="grid grid-cols-2 sm:grid-cols-3 gap-4 mb-8">

            <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm">
                <p class="text-xs font-medium text-slate-400 uppercase tracking-wider"
                    x-text="t('totalItems')"></p>

                <p class="text-2xl font-bold text-slate-800 mt-1"
                    x-text="items.length"></p>
            </div>

            <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm">
                <p class="text-xs font-medium text-amber-500 uppercase tracking-wider"
                    x-text="t('lowStockCount')"></p>

                <p class="text-2xl font-bold text-amber-600 mt-1"
                    x-text="lowStockItems.length"></p>
            </div>

            <div
                class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm col-span-2 sm:col-span-1">

                <p class="text-xs font-medium text-rose-500 uppercase tracking-wider"
                    x-text="t('outOfStockCount')"></p>

                <p class="text-2xl font-bold text-rose-600 mt-1"
                    x-text="outOfStockItems.length"></p>
            </div>

        </div>


        <!-- Main Navigation -->
        <div
            class="flex flex-col sm:flex-row justify-between items-stretch sm:items-center gap-4 mb-6">

            <!-- Tabs -->
            <div class="flex bg-slate-200/60 p-1 rounded-xl">

                <button @click="currentTab = 'inventory'"
                    :class="currentTab === 'inventory'
                        ? 'bg-white shadow-sm text-slate-900 font-semibold'
                        : 'text-slate-600 hover:text-slate-900'"
                    class="flex-1 sm:flex-none px-4 py-2 text-xs rounded-lg transition-all">

                    <span x-text="t('tabInventory')"></span>

                </button>


                <!-- FIXED REORDER BUTTON -->
                <button @click="currentTab = 'reorder'"
                    :class="currentTab === 'reorder'
                        ? 'bg-white shadow-sm text-slate-900 font-semibold'
                        : 'text-slate-600 hover:text-slate-900'"
                    class="flex-1 sm:flex-none px-4 py-2 text-xs rounded-lg transition-all relative">

                    <span x-text="t('tabReorderList')"></span>

                    <span x-show="reorderItems.length > 0"
                        x-cloak
                        class="absolute -top-1 -right-1 bg-rose-500 text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold"
                        x-text="reorderItems.length">
                    </span>

                </button>

            </div>


            <!-- Add Item Button -->
            <button @click="openModal()"
                class="bg-slate-900 hover:bg-slate-800 text-white px-5 py-2.5 rounded-xl text-xs font-semibold tracking-wide shadow-sm transition-all flex items-center justify-center gap-2">

                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 4v16m8-8H4">
                    </path>
                </svg>

                <span x-text="t('addNewItem')"></span>

            </button>

        </div>


        <!-- INVENTORY TAB -->
        <div x-show="currentTab === 'inventory'" x-cloak class="space-y-4">

            <!-- Search -->
            <div
                class="bg-white p-3 rounded-2xl border border-slate-100 shadow-sm flex flex-col sm:flex-row gap-3">

                <div class="relative flex-1">

                    <svg class="w-4 h-4 text-slate-400 absolute left-3.5 top-3.5"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24">

                        <path stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z">
                        </path>

                    </svg>

                    <input type="text"
                        x-model.debounce.300ms="searchQuery"
                        :placeholder="t('searchPlaceholder')"
                        class="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-slate-400 transition-all">

                </div>


                <!-- Category Filter -->
                <select x-model="filterCategory"
                    class="bg-slate-50 border border-slate-200 text-xs rounded-xl px-3 py-2 focus:outline-none focus:border-slate-400">

                    <option value=""
                        x-text="t('allCategories')">
                    </option>

                    <template x-for="cat in categories" :key="cat">

                        <option :value="cat"
                            x-text="cat">
                        </option>

                    </template>

                </select>

            </div>


            <!-- Items Table -->
            <div
                class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">

                <div class="overflow-x-auto">

                    <table class="w-full text-left border-collapse">

                        <thead>

                            <tr
                                class="border-b border-slate-100 text-[11px] font-semibold text-slate-400 uppercase tracking-wider bg-slate-50/50">

                                <th class="p-4"
                                    x-text="t('colItemName')"></th>

                                <th class="p-4"
                                    x-text="t('colCategory')"></th>

                                <th class="p-4"
                                    x-text="t('colStock')"></th>

                                <th class="p-4"
                                    x-text="t('colMinStock')"></th>

                                <th class="p-4 text-right"
                                    x-text="t('colActions')"></th>

                            </tr>

                        </thead>


                        <tbody
                            class="divide-y divide-slate-100 text-xs">

                            <template x-for="item in filteredItems"
                                :key="item.id">

                                <tr
                                    class="hover:bg-slate-50/50 transition-all">

                                    <td class="p-4">

                                        <div class="font-semibold text-slate-800"
                                            x-text="item.name">
                                        </div>

                                        <div class="text-[10px] text-slate-400"
                                            x-text="item.unit">
                                        </div>

                                    </td>


                                    <td class="p-4 text-slate-600">

                                        <span
                                            class="bg-slate-100 text-slate-600 px-2.5 py-1 rounded-lg text-[10px] font-medium"
                                            x-text="item.category">
                                        </span>

                                    </td>


                                    <!-- Stock -->
                                    <td class="p-4">

                                        <div class="flex items-center gap-3">

                                            <span
                                                :class="item.stock === 0
                                                    ? 'text-rose-600 font-bold'
                                                    : item.stock <= item.minStock
                                                        ? 'text-amber-600 font-bold'
                                                        : 'text-slate-800 font-medium'"
                                                x-text="item.stock">
                                            </span>


                                            <!-- Quick Stock Adjustment -->
                                            <div
                                                class="flex items-center border border-slate-200 rounded-lg overflow-hidden bg-white">

                                                <button
                                                    @click="updateStock(item.id, -1)"
                                                    class="px-2 py-0.5 text-slate-500 hover:bg-slate-100 transition-all">

                                                    -
                                                </button>

                                                <span
                                                    class="w-[1px] bg-slate-200">
                                                </span>

                                                <button
                                                    @click="updateStock(item.id, 1)"
                                                    class="px-2 py-0.5 text-slate-500 hover:bg-slate-100 transition-all">

                                                    +
                                                </button>

                                            </div>

                                        </div>

                                    </td>


                                    <td class="p-4 text-slate-500"
                                        x-text="item.minStock">
                                    </td>


                                    <!-- Actions -->
                                    <td class="p-4 text-right">

                                        <button @click="editItem(item)"
                                            class="text-slate-400 hover:text-slate-700 mr-2 p-1">

                                            ✏️

                                        </button>


                                        <button @click="deleteItem(item.id)"
                                            class="text-slate-400 hover:text-rose-600 p-1">

                                            🗑️

                                        </button>

                                    </td>

                                </tr>

                            </template>


                            <!-- Empty State -->
                            <template x-if="filteredItems.length === 0">

                                <tr>

                                    <td colspan="5"
                                        class="p-8 text-center text-slate-400"
                                        x-text="t('noItemsFound')">
                                    </td>

                                </tr>

                            </template>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>


        <!-- REORDER TAB -->
        <div x-show="currentTab === 'reorder'" x-cloak class="space-y-4">

            <div
                class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">

                <div>

                    <h2 class="text-base font-bold text-slate-800"
                        x-text="t('reorderTitle')">
                    </h2>

                    <p class="text-xs text-slate-500 mt-0.5"
                        x-text="t('reorderSubtitle')">
                    </p>

                </div>


                <button @click="copyReorderList()"
                    class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-xl text-xs font-semibold tracking-wide transition-all flex items-center gap-2">

                    📋

                    <span x-text="t('copyWhatsAppList')"></span>

                </button>

            </div>


            <!-- Reorder Cards -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">

                <template x-for="item in reorderItems"
                    :key="item.id">

                    <div
                        class="bg-white p-4 rounded-2xl border border-amber-100 shadow-sm flex justify-between items-center">

                        <div>

                            <span
                                class="bg-amber-50 text-amber-700 text-[10px] font-semibold px-2 py-0.5 rounded-md"
                                x-text="item.category">
                            </span>

                            <h3 class="font-bold text-slate-800 text-sm mt-1"
                                x-text="item.name">
                            </h3>

                            <p class="text-xs text-slate-500 mt-0.5">

                                <span
                                    x-text="t('currentStockLabel') + ': '">
                                </span>

                                <strong class="text-rose-600"
                                    x-text="item.stock">
                                </strong>

                                /

                                <span
                                    x-text="t('minLabel') + ': ' + item.minStock + ' ' + item.unit">
                                </span>

                            </p>

                        </div>


                        <div class="text-right">

                            <span
                                class="text-[10px] font-medium text-slate-400 block"
                                x-text="t('suggestedOrder')">
                            </span>

                            <span
                                class="text-base font-bold text-slate-800"
                                x-text="Math.max(0, (item.minStock * 2) - item.stock) + ' ' + item.unit">
                            </span>

                        </div>

                    </div>

                </template>


                <!-- Everything Stocked -->
                <template x-if="reorderItems.length === 0">

                    <div
                        class="col-span-2 bg-white p-12 text-center rounded-2xl border border-slate-100 shadow-sm">

                        <div class="text-4xl mb-3">✅</div>

                        <p class="text-sm font-semibold text-slate-800"
                            x-text="t('allStockedUp')">
                        </p>

                        <p class="text-xs text-slate-400 mt-1"
                            x-text="t('noItemsRequired')">
                        </p>

                    </div>

                </template>

            </div>

        </div>


        <!-- ADD / EDIT MODAL -->
        <div x-show="showModal"
            x-cloak
            x-transition
            class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">

            <div @click.outside="closeModal()"
                class="bg-white rounded-2xl p-6 max-w-md w-full shadow-xl border border-slate-100 space-y-4">

                <h3 class="text-lg font-bold text-slate-800"
                    x-text="isEditing ? t('editItemTitle') : t('addItemTitle')">
                </h3>


                <div class="space-y-3 text-xs">

                    <!-- Name -->
                    <div>

                        <label
                            class="block font-medium text-slate-600 mb-1"
                            x-text="t('colItemName')">
                        </label>

                        <input type="text"
                            x-model.trim="form.name"
                            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 focus:outline-none focus:border-slate-400"
                            :placeholder="t('placeholderName')">

                    </div>


                    <!-- Category & Unit -->
                    <div class="grid grid-cols-2 gap-3">

                        <div>

                            <label
                                class="block font-medium text-slate-600 mb-1"
                                x-text="t('colCategory')">
                            </label>

                            <input type="text"
                                x-model.trim="form.category"
                                class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 focus:outline-none focus:border-slate-400"
                                :placeholder="t('placeholderCategory')">

                        </div>


                        <div>

                            <label
                                class="block font-medium text-slate-600 mb-1"
                                x-text="t('unitLabel')">
                            </label>

                            <input type="text"
                                x-model.trim="form.unit"
                                class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 focus:outline-none focus:border-slate-400"
                                placeholder="Pcs / Kg / Box">

                        </div>

                    </div>


                    <!-- Stock -->
                    <div class="grid grid-cols-2 gap-3">

                        <div>

                            <label
                                class="block font-medium text-slate-600 mb-1"
                                x-text="t('colStock')">
                            </label>

                            <input type="number"
                                min="0"
                                step="1"
                                x-model.number="form.stock"
                                class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 focus:outline-none focus:border-slate-400">

                        </div>


                        <div>

                            <label
                                class="block font-medium text-slate-600 mb-1"
                                x-text="t('colMinStock')">
                            </label>

                            <input type="number"
                                min="0"
                                step="1"
                                x-model.number="form.minStock"
                                class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 focus:outline-none focus:border-slate-400">

                        </div>

                    </div>

                </div>


                <!-- Modal Actions -->
                <div class="flex justify-end gap-2 pt-2">

                    <button @click="closeModal()"
                        class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl text-xs font-semibold transition-all"
                        x-text="t('cancelBtn')">
                    </button>


                    <button @click="saveItem()"
                        class="px-4 py-2 bg-slate-900 hover:bg-slate-800 text-white rounded-xl text-xs font-semibold transition-all"
                        x-text="t('saveBtn')">
                    </button>

                </div>

            </div>

        </div>


        <!-- Toast -->
        <div x-show="toastMessage"
            x-cloak
            x-transition
            class="fixed bottom-6 right-6 bg-slate-900 text-white px-4 py-3 rounded-xl text-xs font-medium shadow-lg z-50 flex items-center gap-2">

            <span>✓</span>

            <span x-text="toastMessage"></span>

        </div>

    </div>


    <!-- APPLICATION SCRIPT -->
    <script>

        const translations = {

            en: {
                appTitle: "Vyapar Stock Manager",
                appSubtitle: "Smart local shop stock & reorder checklist tracker",

                totalItems: "Total Items",
                lowStockCount: "Low Stock Items",
                outOfStockCount: "Out of Stock",

                tabInventory: "Inventory Stock",
                tabReorderList: "Shopping List",

                addNewItem: "Add Item",

                searchPlaceholder: "Search items...",
                allCategories: "All Categories",

                colItemName: "Item Name",
                colCategory: "Category",
                colStock: "Current Stock",
                colMinStock: "Min Required",
                colActions: "Actions",

                noItemsFound: "No items match your search.",

                reorderTitle: "Required Restock List",
                reorderSubtitle: "Items below minimum stock level that need restocking.",

                copyWhatsAppList: "Copy List for WhatsApp",

                currentStockLabel: "Current Stock",
                minLabel: "Min Required",
                suggestedOrder: "Suggested Order",

                allStockedUp: "Everything is fully stocked!",
                noItemsRequired: "No items are required right now. Good job!",

                addItemTitle: "Add New Inventory Item",
                editItemTitle: "Edit Inventory Item",

                placeholderName: "e.g., Cooking Oil, Sugar",
                placeholderCategory: "e.g., Grocery, Snacks",

                unitLabel: "Unit (Pcs/Kg/Box)",

                cancelBtn: "Cancel",
                saveBtn: "Save Item",

                toastSaved: "Item saved successfully!",
                toastDeleted: "Item removed.",
                toastCopied: "Reorder list copied to clipboard!",
                toastCopyFailed: "Failed to copy the list.",
                validationError: "Please fill all fields correctly.",
                confirmDelete: "Are you sure you want to delete this item?"
            },


            hi: {
                appTitle: "व्यापार स्टॉक मैनेजर",
                appSubtitle: "दुकान का सामान और जरूरी खरीदारी की सूची",

                totalItems: "कुल सामान",
                lowStockCount: "कम स्टॉक वाले सामान",
                outOfStockCount: "खत्म हो चुके सामान",

                tabInventory: "दुकान का स्टॉक",
                tabReorderList: "खरीदने की सूची",

                addNewItem: "नया सामान जोड़ें",

                searchPlaceholder: "सामान खोजें...",
                allCategories: "सभी श्रेणियां",

                colItemName: "सामान का नाम",
                colCategory: "श्रेणी",
                colStock: "मौजूदा स्टॉक",
                colMinStock: "न्यूनतम जरूरी",
                colActions: "कार्रवाई",

                noItemsFound: "कोई सामान नहीं मिला।",

                reorderTitle: "मंगवाने वाले सामान की सूची",
                reorderSubtitle: "जो सामान न्यूनतम मात्रा से कम हो गया है।",

                copyWhatsAppList: "व्हाट्सएप के लिए कॉपी करें",

                currentStockLabel: "मौजूदा स्टॉक",
                minLabel: "न्यूनतम",
                suggestedOrder: "सुझाया गया ऑर्डर",

                allStockedUp: "स्टॉक पूरा है!",
                noItemsRequired: "अभी किसी नए सामान की जरूरत नहीं है।",

                addItemTitle: "नया सामान जोड़ें",
                editItemTitle: "सामान में सुधार करें",

                placeholderName: "जैसे: चीनी, तेल, साबुन",
                placeholderCategory: "जैसे: किराना, स्नैक्स",

                unitLabel: "इकाई",

                cancelBtn: "रद्द करें",
                saveBtn: "सुरक्षित करें",

                toastSaved: "सामान सफलतापूर्वक सहेज लिया गया!",
                toastDeleted: "सामान हटा दिया गया।",
                toastCopied: "मंगवाने वाली सूची कॉपी हो गई!",
                toastCopyFailed: "सूची कॉपी नहीं हो सकी।",
                validationError: "कृपया सभी जानकारी सही भरें।",
                confirmDelete: "क्या आप यह सामान हटाना चाहते हैं?"
            }

        };


        function inventoryApp() {

            return {

                lang: 'en',

                currentTab: 'inventory',

                searchQuery: '',

                filterCategory: '',

                showModal: false,

                isEditing: false,

                toastMessage: '',

                toastTimer: null,


                form: {
                    id: null,
                    name: '',
                    category: '',
                    unit: 'Pcs',
                    stock: 10,
                    minStock: 5
                },


                items: [],


                defaultItems: [
                    {
                        id: 1,
                        name: 'Basmati Rice (5kg)',
                        category: 'Grocery',
                        unit: 'Bag',
                        stock: 3,
                        minStock: 5
                    },
                    {
                        id: 2,
                        name: 'Refined Oil (1L)',
                        category: 'Grocery',
                        unit: 'Bottle',
                        stock: 2,
                        minStock: 10
                    },
                    {
                        id: 3,
                        name: 'Tea Powder (250g)',
                        category: 'Beverages',
                        unit: 'Pcs',
                        stock: 12,
                        minStock: 4
                    },
                    {
                        id: 4,
                        name: 'Colgate Toothpaste',
                        category: 'Personal Care',
                        unit: 'Pcs',
                        stock: 1,
                        minStock: 6
                    },
                    {
                        id: 5,
                        name: 'Wheat Flour (10kg)',
                        category: 'Grocery',
                        unit: 'Bag',
                        stock: 8,
                        minStock: 5
                    }
                ],


                // Initialize Application
                init() {

                    try {

                        const savedItems =
                            localStorage.getItem('vyaparInventoryItems');

                        if (savedItems) {

                            const parsedItems =
                                JSON.parse(savedItems);

                            if (Array.isArray(parsedItems)) {
                                this.items = parsedItems;
                            } else {
                                this.items = [...this.defaultItems];
                            }

                        } else {

                            this.items = [...this.defaultItems];

                            this.saveToStorage();

                        }

                    } catch (error) {

                        console.error(
                            'Failed to load inventory:',
                            error
                        );

                        this.items = [...this.defaultItems];

                    }

                },


                // Translation Function
                t(key) {

                    return translations[this.lang]?.[key] || key;

                },


                // Categories
                get categories() {

                    return [
                        ...new Set(
                            this.items
                                .map(item => item.category)
                                .filter(Boolean)
                        )
                    ];

                },


                // Filtered Inventory
                get filteredItems() {

                    const query =
                        this.searchQuery
                            .toLowerCase()
                            .trim();

                    return this.items.filter(item => {

                        const matchesSearch =
                            item.name.toLowerCase().includes(query) ||
                            item.category.toLowerCase().includes(query);

                        const matchesCategory =
                            this.filterCategory === '' ||
                            item.category === this.filterCategory;

                        return matchesSearch && matchesCategory;

                    });

                },


                // Low Stock = Stock > 0 and <= Minimum
                get lowStockItems() {

                    return this.items.filter(
                        item =>
                            item.stock > 0 &&
                            item.stock <= item.minStock
                    );

                },


                // Out of Stock = Exactly 0
                get outOfStockItems() {

                    return this.items.filter(
                        item => item.stock === 0
                    );

                },


                // Reorder List = Low Stock + Out of Stock
                get reorderItems() {

                    return this.items.filter(
                        item => item.stock <= item.minStock
                    );

                },


                // Open Add Modal
                openModal() {

                    this.isEditing = false;

                    this.form = {
                        id: null,
                        name: '',
                        category: '',
                        unit: 'Pcs',
                        stock: 10,
                        minStock: 5
                    };

                    this.showModal = true;

                },


                // Edit Item
                editItem(item) {

                    this.isEditing = true;

                    this.form = {
                        ...item
                    };

                    this.showModal = true;

                },


                // Close Modal
                closeModal() {

                    this.showModal = false;

                },


                // Save Item
                saveItem() {

                    this.form.name =
                        String(this.form.name || '').trim();

                    this.form.category =
                        String(this.form.category || '').trim();

                    this.form.unit =
                        String(this.form.unit || '').trim();


                    const stock =
                        Number(this.form.stock);

                    const minStock =
                        Number(this.form.minStock);


                    // Validation
                    if (
                        !this.form.name ||
                        !this.form.category ||
                        !this.form.unit ||
                        !Number.isFinite(stock) ||
                        !Number.isFinite(minStock) ||
                        stock < 0 ||
                        minStock < 0
                    ) {

                        this.showToast(
                            this.t('validationError')
                        );

                        return;

                    }


                    this.form.stock = stock;

                    this.form.minStock = minStock;


                    if (this.isEditing) {

                        const index =
                            this.items.findIndex(
                                item =>
                                    item.id === this.form.id
                            );

                        if (index !== -1) {

                            this.items[index] = {
                                ...this.form
                            };

                        }

                    } else {

                        const newId =
                            window.crypto?.randomUUID
                                ? crypto.randomUUID()
                                : Date.now().toString() +
                                  Math.random().toString(16).slice(2);


                        this.items.push({
                            ...this.form,
                            id: newId
                        });

                    }


                    this.saveToStorage();

                    this.closeModal();

                    this.showToast(
                        this.t('toastSaved')
                    );

                },


                // Delete Item
                deleteItem(id) {

                    const confirmed =
                        confirm(
                            this.t('confirmDelete')
                        );

                    if (!confirmed) return;


                    this.items =
                        this.items.filter(
                            item => item.id !== id
                        );


                    this.saveToStorage();

                    this.showToast(
                        this.t('toastDeleted')
                    );

                },


                // Update Stock
                updateStock(id, amount) {

                    const item =
                        this.items.find(
                            item => item.id === id
                        );


                    if (item) {

                        item.stock = Math.max(
                            0,
                            Number(item.stock) + amount
                        );

                        this.saveToStorage();

                    }

                },


                // Save to LocalStorage
                saveToStorage() {

                    try {

                        localStorage.setItem(
                            'vyaparInventoryItems',
                            JSON.stringify(this.items)
                        );

                    } catch (error) {

                        console.error(
                            'Failed to save inventory:',
                            error
                        );

                    }

                },


                // Copy Reorder List
                async copyReorderList() {

                    if (this.reorderItems.length === 0) {

                        this.showToast(
                            this.t('noItemsRequired')
                        );

                        return;

                    }


                    let text =
                        this.lang === 'hi'
                            ? "🛒 *दुकान के लिए मंगवाने वाला सामान*\n\n"
                            : "🛒 *Shop Reorder & Required Items List*\n\n";


                    this.reorderItems.forEach(
                        (item, index) => {

                            const needed =
                                Math.max(
                                    0,
                                    (item.minStock * 2) -
                                    item.stock
                                );


                            text +=
                                `${index + 1}. *${item.name}*\n` +
                                `   Required: ${needed} ${item.unit}\n` +
                                `   Current Stock: ${item.stock}\n\n`;

                        }
                    );


                    try {

                        await navigator.clipboard.writeText(text);

                        this.showToast(
                            this.t('toastCopied')
                        );

                    } catch (error) {

                        console.warn(
                            'Clipboard API failed, using fallback.',
                            error
                        );

                        this.fallbackCopy(text);

                    }

                },


                // Clipboard Fallback
                fallbackCopy(text) {

                    try {

                        const textarea =
                            document.createElement('textarea');

                        textarea.value = text;

                        textarea.style.position = 'fixed';

                        textarea.style.opacity = '0';

                        document.body.appendChild(textarea);

                        textarea.focus();

                        textarea.select();

                        const success =
                            document.execCommand('copy');

                        document.body.removeChild(textarea);


                        if (success) {

                            this.showToast(
                                this.t('toastCopied')
                            );

                        } else {

                            this.showToast(
                                this.t('toastCopyFailed')
                            );

                        }

                    } catch (error) {

                        console.error(
                            'Fallback copy failed:',
                            error
                        );

                        this.showToast(
                            this.t('toastCopyFailed')
                        );

                    }

                },


                // Toast Notification
                showToast(message) {

                    if (this.toastTimer) {

                        clearTimeout(
                            this.toastTimer
                        );

                    }


                    this.toastMessage = message;


                    this.toastTimer =
                        setTimeout(() => {

                            this.toastMessage = '';

                            this.toastTimer = null;

                        }, 2500);

                }

            };

        }

    </script>
